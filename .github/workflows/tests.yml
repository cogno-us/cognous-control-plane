name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Authorization control removal probes
        run: python tools/adversarial_mutations.py

  manifest-validator-parity:
    # Runs the in-tree validator port against the real action-manifest validator at the revision this repo already pins
    # (MANIFEST_UPSTREAM_COMMIT in src/agent_control_plane/bounded.py; no new pin). That revision implements E001-E021, so
    # the parity test compares the codes it implements and reports the rest as skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the action-manifest at the pinned revision
        run: |
          COMMIT="$(python -c 'from agent_control_plane.bounded import MANIFEST_UPSTREAM_COMMIT as c; print(c)')"
          echo "action-manifest revision: $COMMIT"
          pip install --no-deps "git+https://github.com/cogno-us/cognous-action-manifest.git@${COMMIT}"
          python -c "import agent_action_manifest"

      - name: Validator port parity with the real validator
        run: pytest -q -rs tests/test_scan6_manifest_validator_parity.py
