name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      # F4 ages-only (M11 increment): the Registry-governed tests must EXECUTE here. They need a Registry checkout at the exact pin and PyNaCl from Registry's
      # hash-locked requirements. OCS_REQUIRE_REGISTRY_PIN=1 turns a missing/wrong pin or missing PyNaCl into a FAILURE, and the junit check below fails the job
      # if any test in the module was skipped or fewer than the expected number ran. The env var is scoped to this step only: other modules that read
      # OCS_REGISTRY_PIN_DIR assert different Registry pins and are intentionally not run against this one.
      - name: Check out the pinned Registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: 6f600ab1150f00ef3d96834159b1807e866a78b6
          path: registry-pin

      - name: Install the Registry Ed25519 dependency (hash-locked)
        run: python -m pip install --require-hashes -r registry-pin/requirements-ed25519.lock.txt

      - name: Run the Registry-governed F4 age tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            git -C registry-pin rev-parse HEAD
            test "$(git -C registry-pin rev-parse HEAD)" = "6f600ab1150f00ef3d96834159b1807e866a78b6"
            python -c "import nacl, sys; print('pynacl', nacl.__version__, sys.version.split()[0])"
            pytest -q tests/test_f4_age_governance.py --junitxml=f4-age-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("f4-age-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"f4 age tests: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= 70, "Registry-governed tests were skipped or did not run"
          PY
          } 2>&1 | tee f4-age-out.txt || {
            echo "::error title=F4 age tests failed::$(tail -n 40 f4-age-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # F5 per-class status age (M12 increment): same rules as the F4 step above. The Registry pin is the same checkout (it already contains the r08-v2 F5 composer).
      - name: Run the Registry-governed F5 class-age tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            git -C registry-pin rev-parse HEAD
            test "$(git -C registry-pin rev-parse HEAD)" = "6f600ab1150f00ef3d96834159b1807e866a78b6"
            python -c "import nacl, sys; print('pynacl', nacl.__version__, sys.version.split()[0])"
            pytest -q tests/test_f5_class_age_governance.py --junitxml=f5-class-age-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("f5-class-age-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"f5 class-age tests: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= 105, "Registry-governed F5 tests were skipped or did not run"
          PY
          } 2>&1 | tee f5-class-age-out.txt || {
            echo "::error title=F5 class-age tests failed::$(tail -n 40 f5-class-age-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # F5 per-class on_unreadable (this increment): needs the Registry r08-v5 contract, which is NOT in the 6f600ab checkout above. A SECOND checkout at the exact Registry
      # implementation-PR head (cogno-us/cognous-ocs-registry#64) is used for this step only; the F4 and F5 class-age steps above keep their own pin unchanged. Same rules:
      # missing/wrong pin or missing PyNaCl is a FAILURE (OCS_REQUIRE_REGISTRY_PIN=1) and the junit gate fails on any skip or fewer tests than expected.
      - name: Check out the Registry at the r08-v5 pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: 6c3e5e4037d34bd2b31371461bfc872c762026b9
          path: registry-pin-v5

      - name: Run the Registry-governed F5 on_unreadable tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin-v5
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            git -C registry-pin-v5 rev-parse HEAD
            test "$(git -C registry-pin-v5 rev-parse HEAD)" = "6c3e5e4037d34bd2b31371461bfc872c762026b9"
            python -c "import nacl, sys; print('pynacl', nacl.__version__, sys.version.split()[0])"
            pytest -q tests/test_f5_class_unreadable_governance.py --junitxml=f5-unreadable-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("f5-unreadable-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"f5 on_unreadable tests: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= 148, "Registry-governed on_unreadable tests were skipped or did not run"
          PY
          } 2>&1 | tee f5-unreadable-out.txt || {
            echo "::error title=F5 on_unreadable tests failed::$(tail -n 40 f5-unreadable-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # Composed governed policy workflow (F4 + F5 class age + F5 on_unreadable, shared lifecycle consolidation). Reuses the r08-v5 Registry checkout above (no new pin); same rules:
      # missing/wrong pin or missing PyNaCl is a FAILURE and the junit gate fails on any skip or fewer tests than expected.
      - name: Run the composed Registry-governed policy tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin-v5
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            test "$(git -C registry-pin-v5 rev-parse HEAD)" = "6c3e5e4037d34bd2b31371461bfc872c762026b9"
            pytest -q tests/test_governed_policy_composition.py --junitxml=governed-policy-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("governed-policy-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"governed policy tests: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= 99, "composed governed-policy tests were skipped or did not run"
          PY
          } 2>&1 | tee governed-policy-out.txt || {
            echo "::error title=Composed governed policy tests failed::$(tail -n 40 governed-policy-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # Registry-governed requires_revocation_assurance and terminal-revocation enablement (Registry r08-v6). Needs the r08-v6 contract, which is in NEITHER earlier pin: a THIRD checkout at the
      # exact Registry implementation-PR head is used for this step only (it contains r08-v1..r08-v5 byte-identical). Same rules: a missing/wrong pin or missing PyNaCl is a FAILURE
      # (OCS_REQUIRE_REGISTRY_PIN=1) and the junit gate fails on any skip or fewer tests than expected.
      - name: Check out the Registry at the r08-v6 pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: 42a666328b974a7581013358bcf8bc7b9eac7761
          path: registry-pin-v6

      - name: Run the Registry-governed revocation-families tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin-v6
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            test "$(git -C registry-pin-v6 rev-parse HEAD)" = "42a666328b974a7581013358bcf8bc7b9eac7761"
            python -c "import nacl, sys; print('pynacl', nacl.__version__, sys.version.split()[0])"
            pytest -q tests/test_revocation_families_governance.py tests/test_governed_policy_composition.py tests/test_f5_class_unreadable_governance.py --junitxml=revocation-families-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("revocation-families-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"revocation families + composed + on_unreadable tests under the r08-v6 pin: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= 388, "Registry-governed revocation-families tests were skipped or did not run"
          PY
          } 2>&1 | tee revocation-families-out.txt || {
            echo "::error title=Revocation families tests failed::$(tail -n 40 revocation-families-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # Registry-governed ActionClass.irreversible (Registry r08-v7, unified engine) and the immutable effective-policy snapshot. Needs the r08-v7 contract, which is in NONE of the earlier pins: a
      # FOURTH checkout at the exact Registry r08-v7 head is used for this step only (it contains r08-v1..r08-v6 byte-identical, so the r08-v6 suites also run against it). THE PIN BELOW IS A
      # The pinned Registry commit (also PIN_V7 in tests/test_f5_class_unreadable_governance.py); a wrong or missing pin fails closed. Same rules:
      # a missing/wrong pin or missing PyNaCl is a FAILURE (OCS_REQUIRE_REGISTRY_PIN=1) and the junit gate fails on any skip or fewer tests than expected.
      - name: Check out the Registry at the r08-v7 pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: b73c59e6769acd5af7263397e81dfc6fa4561f38
          path: registry-pin-v7

      - name: Run the Registry-governed irreversibility tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin-v7
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            test "$(git -C registry-pin-v7 rev-parse HEAD)" = "b73c59e6769acd5af7263397e81dfc6fa4561f38"
            python -c "import nacl, sys; print('pynacl', nacl.__version__, sys.version.split()[0])"
            pytest -q tests/test_irreversibility_governance.py tests/test_irreversibility_unit.py tests/test_revocation_families_governance.py tests/test_governed_policy_composition.py tests/test_f5_class_unreadable_governance.py --junitxml=irreversibility-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("irreversibility-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"irreversibility + unit + revocation families + composed + on_unreadable tests under the r08-v7 pin: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= 576, "Registry-governed irreversibility tests were skipped or did not run"
          PY
          } 2>&1 | tee irreversibility-out.txt || {
            echo "::error title=Irreversibility tests failed::$(tail -n 40 irreversibility-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      # FINAL3 consumers (anchor deadline, ObservationPolicy max age and clock tolerance; Registry r08-v8). Needs the r08-v8 contract, which is in NONE of the earlier pins: a FIFTH checkout at the
      # exact head of Registry PR #77 (it contains r08-v1..r08-v7 byte-identical, so the earlier governed suites are re-run unchanged under it). The pin below is also PIN_V8 in
      # tests/test_f5_class_unreadable_governance.py. Same rules: a missing/wrong pin or missing PyNaCl is a FAILURE (OCS_REQUIRE_REGISTRY_PIN=1) and the junit gate fails on any skip or
      # fewer tests than expected. BUILDER_TESTED developer evidence; not independent qualification.
      - name: Check out the Registry at the r08-v8 pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cogno-us/cognous-ocs-registry
          ref: a40fe755e2384a99c37016fa9ad59396f1835900
          path: registry-pin-v8

      - name: Run the Registry-governed FINAL3 consumer tests (must not skip)
        env:
          OCS_REGISTRY_PIN_DIR: ${{ github.workspace }}/registry-pin-v8
          OCS_REQUIRE_REGISTRY_PIN: "1"
        run: |
          set -o pipefail
          {
            test "$(git -C registry-pin-v8 rev-parse HEAD)" = "a40fe755e2384a99c37016fa9ad59396f1835900"
            python -c "import nacl, sys; print('pynacl', nacl.__version__, sys.version.split()[0])"
            pytest -q tests/test_final3_anchor.py tests/test_final3_observation.py tests/test_final3_composed_binding.py tests/test_irreversibility_governance.py tests/test_irreversibility_unit.py tests/test_revocation_families_governance.py tests/test_governed_policy_composition.py tests/test_f5_class_unreadable_governance.py --junitxml=final3-junit.xml
            python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("final3-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite[0]
          n, skipped, failed = int(suite.get("tests")), int(suite.get("skipped")), int(suite.get("failures")) + int(suite.get("errors"))
          print(f"FINAL3 consumers + earlier governed suites under the r08-v8 pin: {n} run, {skipped} skipped, {failed} failed")
          assert skipped == 0 and failed == 0 and n >= @@N@@, "Registry-governed FINAL3 tests were skipped or did not run"
          PY
          } 2>&1 | tee final3-out.txt || {
            echo "::error title=FINAL3 consumer tests failed::$(tail -n 40 final3-out.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - name: Authorization control removal probes
        run: python tools/adversarial_mutations.py

  manifest-validator-parity:
    # Runs the in-tree validator port against the real action-manifest validator at the revision this repo already pins
    # (MANIFEST_UPSTREAM_COMMIT in src/agent_control_plane/bounded.py; no new pin). That revision implements E001-E021, so
    # the parity test compares the codes it implements and reports the rest as skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the action-manifest at the pinned revision
        run: |
          COMMIT="$(python -c 'from agent_control_plane.bounded import MANIFEST_UPSTREAM_COMMIT as c; print(c)')"
          echo "action-manifest revision: $COMMIT"
          pip install --no-deps "git+https://github.com/cogno-us/cognous-action-manifest.git@${COMMIT}"
          python -c "import agent_action_manifest"

      - name: Validator port parity with the real validator
        run: pytest -q -rs tests/test_scan6_manifest_validator_parity.py
